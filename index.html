<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <title>Receitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <span class="logo-text">Saborify</span>
    </div>

    <nav class="header-nav">
      <a href="index.html" class="nav-link active">Receitas</a>
      <a href="#" class="nav-link">Categorias</a>
    </nav>

    <div class="header-right">
      <button class="btn btn-outline">
        Entrar
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>Receitas Deliciosas e Fáceis</h1>
      <p>Descubra receitas práticas e saborosas para o seu dia a dia</p>

      <div class="hero-search">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          placeholder="Buscar receitas..."
        />
      </div>
    </div>
  </section>

  <!-- FILTROS -->
  <section class="filters">
    <div class="filters-inner">
      <div class="filter-group">
        <label for="tipoPrato">Tipo de Prato</label>
        <select id="tipoPrato">
          <option value="">Todos os tipos</option>
          <option value="entrada">Entrada</option>
          <option value="principal">Prato principal</option>
          <option value="sobremesa">Sobremesa</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="dificuldade">Dificuldade</label>
        <select id="dificuldade">
          <option value="">Todas</option>
          <option value="facil">Fácil</option>
          <option value="medio">Médio</option>
          <option value="dificil">Difícil</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="tempoMaximo">Tempo Máximo</label>
        <select id="tempoMaximo">
          <option value="">Qualquer tempo</option>
          <option value="15">Até 15 min</option>
          <option value="30">Até 30 min</option>
          <option value="60">Até 1 hora</option>
          <option value="120">Até 2 horas</option>
        </select>
      </div>
    </div>
  </section>

  <!-- LISTA DE RECEITAS -->
  <main class="recipes-section">
    <div class="recipes-header">
      <span>Mostrando <span id="recipesCount">0</span> receitas</span>
    </div>

    <div id="recipesGrid" class="recipes-grid">
      <!-- Cards gerados via JS -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
